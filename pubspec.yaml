name: lumira_web
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.1
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_bloc: ^9.1.1
  path_provider: ^2.1.6
  get_it: ^9.2.1
  dio: ^5.11.1
  equatable: ^2.1.0
  dartz: ^0.10.1
  cached_network_image: ^4.0.0
  pretty_dio_logger: ^1.4.0
  intl: ^0.20.2
  shimmer: ^4.0.0
  lottie: ^3.5.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.1.1
  flutter_svg: ^2.3.0
  go_router: ^18.0.1
  flutter_screenutil: ^5.9.3
  toastification: ^3.2.0
  video_player: ^2.14.0
  smooth_page_indicator: ^3.0.0
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  universal_html: ^2.3.0
  image: ^4.10.1
  http_parser: ^4.1.2
  tutorial_coach_mark: ^1.3.4
  image_picker: ^1.2.3
  flutter_localization: ^0.4.1
  fl_chart: ^1.2.0
  window_manager: ^0.5.2
  timeago: ^3.7.1
  visibility_detector: ^0.4.0+2
  syncfusion_flutter_xlsio: ^34.2.8
  flutter_image_compress: ^2.5.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - js.json
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/animations/
    - assets/translations/ar-EG.json
    - assets/translations/en-US.json
  fonts:
    - family: LANTX
      fonts:
        - asset: assets/fonts/lantx_bold.otf
          weight: 700
        - asset: assets/fonts/lantx_regular.otf
          weight: 400
        - asset: assets/fonts/lantx_light.otf
          weight: 300


dependency_overrides:
  meta: ^1.19.0
